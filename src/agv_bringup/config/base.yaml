agv_base:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200
    cmd_timeout: 0.25
    control_rate: 20.0
    max_linear_vel: 0.25
    max_angular_vel: 1.0
    track_width: 0.20
    max_pwm: 200
    min_pwm: 60
    odom_frame: "odom"
    base_frame: "base_link"
    # EKF publishes odom->base_link; keep false when using robot_localization
    publish_tf: false
    invert_left: false
    invert_right: false
